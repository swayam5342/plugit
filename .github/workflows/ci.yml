name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full test matrix and fuzzing
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        description: Run the full test matrix and fuzzing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu + stable only. Release/manual: full 3 OS x 2 Go.
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        go: ${{ fromJSON(inputs.full && '["oldstable","stable"]' || '["stable"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go test (race off) for the allocation bounds
        # Skipped under -race: DetectSDL's zero-allocation cheap reject and
        # redact's streaming quote scan (memory independent of the number of
        # quotes). Deterministic, so they run on every OS. bash (with -e) so a
        # failure in the first command fails the step on Windows too.
        shell: bash
        run: |
          go test -count=1 -run '^TestDetectSDLCheapReject$' ./internal/protocol/graphql
          go test -count=1 -run '^TestCanonicalStringsStreamsQuotes$' ./internal/redact
      - name: go test (race off) for the SPEC's 2 s ingest bounds
        # Loosened under -race. Wall-clock bounds run on Linux only, where the
        # runners are the least noisy.
        if: runner.os == 'Linux'
        run: go test -count=1 -run '^(TestGitHubSDLIngestsUnder2s|TestGoldenLargeSpecs)$' ./internal/protocol/graphql ./internal/protocol/rest/openapi

  fuzz:
    if: inputs.full
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/redact, fn: FuzzStringNeverLeaksSecret }
          - { pkg: ./internal/redact, fn: FuzzCanonicalJSON }
          - { pkg: ./internal/redact, fn: FuzzEscapedSecretCaught }
          - { pkg: ./internal/protocol/rest, fn: FuzzEncodeBody }
          - { pkg: ./internal/protocol/rest/openapi, fn: FuzzParse }
          - { pkg: ./internal/protocol/rest/openapi, fn: FuzzRefCheck }
          - { pkg: ./internal/protocol/rest/openapi, fn: FuzzIsOpenAPI }
          - { pkg: ./internal/protocol/graphql, fn: FuzzSDL }
          - { pkg: ./internal/protocol/graphql, fn: FuzzSelection }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: fuzz ${{ matrix.target.fn }} (short)
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 30s -fuzzminimizetime 5s

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...
