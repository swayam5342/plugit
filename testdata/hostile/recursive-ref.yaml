info: {title: hostile, version: '1'}
# T2: self- and mutually-recursive schemas. Must terminate (depth cap).
paths:
  /tree:
    post:
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Tree'}
      responses: {'200': {description: ok}}
components:
  schemas:
    Tree:
      type: object
      properties:
        children: {type: array, items: {$ref: '#/components/schemas/Tree'}}
        other: {$ref: '#/components/schemas/Forest'}
    Forest:
      type: object
      properties:
        trees: {type: array, items: {$ref: '#/components/schemas/Tree'}}
