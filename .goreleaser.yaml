# Release build (SPEC §8, T14). Run by .github/workflows/release.yml on a
# v* tag. Check locally with:
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign,sbom,publish
version: 2

project_name: plugit

before:
  hooks:
    # Fail instead of silently tidying: the tagged tree must be exactly
    # what was reviewed.
    - go mod tidy -diff

builds:
  - id: plugit
    main: ./cmd/plugit
    binary: plugit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    # Reproducible: timestamps come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: plugit
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive (syft).
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksum file, using the workflow's
# GitHub OIDC identity. Verify with:
#   cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/swayam5342/plugit/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum --ignore-missing -c checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

homebrew_casks:
  - name: plugit
    repository:
      owner: swayam5342
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/swayam5342/plugit
    description: Turn any REST API into a curated, safe MCP server
    license: Apache-2.0
    skip_upload: auto # no upload for prereleases

scoops:
  - name: plugit
    repository:
      owner: swayam5342
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: https://github.com/swayam5342/plugit
    description: Turn any REST API into a curated, safe MCP server
    license: Apache-2.0
    skip_upload: auto

release:
  github:
    owner: swayam5342
    name: plugit
  # Published by hand after checking the artifacts and signatures.
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
